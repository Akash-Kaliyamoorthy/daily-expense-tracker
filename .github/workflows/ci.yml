name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-16-chars
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/expense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies
        run: npm run install-all
        env:
          NODE_ENV: development
      - name: Lint
        run: npm run lint
      - name: Build client
        run: npm run build
        env:
          NODE_ENV: production
      - name: Test server
        run: npm test
