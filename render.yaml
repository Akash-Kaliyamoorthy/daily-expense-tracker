# Render Blueprint: one web service (Express serves the built React app) + one Postgres database.
databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_tracker

services:
  - type: web
    name: daily-expense-tracker
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Set this to your service URL after the first deploy, e.g. https://daily-expense-tracker.onrender.com
      # The app and the API share one origin, so the app also works while this is empty.
      - key: CLIENT_URL
        sync: false
