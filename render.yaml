services:
  - type: web
    name: daily-expense-tracker
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: CLIENT_URL
        sync: false